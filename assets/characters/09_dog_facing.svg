<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
<title>Upright dog facing camera</title>
<!-- Palette: black #000000, white #FFFFFF, red #F81C28, yellow #F9DE75. Rotatable groups carry data-pivot and transform="translate(pivot) rotate(DEG)"; animate DEG. -->
<rect id="bg" x="0" y="0" width="800" height="1000" fill="#000000"/>
<line id="ground" x1="150" y1="865" x2="650" y2="865" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/><g id="character"><g id="tail" data-pivot="354,450" transform="translate(354.0,450.0)"><g id="tail-joint" transform="rotate(0.0)"><path d="M 0 0 Q -70 40 -135 -40 Q -60 0 0 -30 Z" fill="#FFFFFF"/></g></g>
<g id="leg-L" data-pivot="380,545" transform="translate(380.0,545.0)"><g id="leg-L-joint" transform="rotate(4.0)"><rect x="-18" y="-18" width="36" height="178" rx="18" ry="18" fill="#FFFFFF"/><g id="shin-L" data-pivot="0,160" transform="translate(0,160) rotate(-2.0)"><rect x="-16" y="-16" width="32" height="171" rx="16" ry="16" fill="#FFFFFF"/><ellipse id="foot-L" cx="10" cy="155" rx="26" ry="14" fill="#FFFFFF"/></g></g></g>
<g id="leg-R" data-pivot="420,545" transform="translate(420.0,545.0)"><g id="leg-R-joint" transform="rotate(-4.0)"><rect x="-18" y="-18" width="36" height="178" rx="18" ry="18" fill="#FFFFFF"/><g id="shin-R" data-pivot="0,160" transform="translate(0,160) rotate(2.0)"><rect x="-16" y="-16" width="32" height="171" rx="16" ry="16" fill="#FFFFFF"/><ellipse id="foot-R" cx="10" cy="155" rx="26" ry="14" fill="#FFFFFF"/></g></g></g>
<g id="torso" data-pivot="400,250" transform="translate(400,250)"><rect x="-46" y="0" width="92" height="300" rx="46" ry="46" fill="#FFFFFF"/></g>
<g id="arm-L" data-pivot="358,282" transform="translate(358.0,282.0)"><g id="arm-L-joint" transform="rotate(12.0)"><rect x="-15" y="-15" width="30" height="150" rx="15" ry="15" fill="#FFFFFF"/><g id="arm-L-lower" data-pivot="0,135" transform="translate(0,135) rotate(4.0)"><rect x="-14" y="-14" width="28" height="134" rx="14" ry="14" fill="#FFFFFF"/></g></g></g>
<g id="arm-R" data-pivot="442,282" transform="translate(442.0,282.0)"><g id="arm-R-joint" transform="rotate(-12.0)"><rect x="-15" y="-15" width="30" height="150" rx="15" ry="15" fill="#FFFFFF"/><g id="arm-R-lower" data-pivot="0,135" transform="translate(0,135) rotate(-4.0)"><rect x="-14" y="-14" width="28" height="134" rx="14" ry="14" fill="#FFFFFF"/></g></g></g>
<g id="head" data-pivot="400,250" transform="translate(400.0,250.0)"><g id="head-joint" transform="rotate(0.0)"><g id="face"><polygon id="ear-L" points="-58,-118 -30,-150 -14,-96" fill="#FFFFFF"/><polygon id="ear-R" points="14,-96 30,-150 58,-118" fill="#FFFFFF"/><circle id="skull" cx="0" cy="-72" r="64" fill="#FFFFFF"/><g id="snout" data-pivot="0,-40"><ellipse cx="0" cy="-40" rx="30" ry="24" fill="#FFFFFF"/><ellipse cx="0" cy="-48" rx="10" ry="7" fill="#000000"/></g><circle id="eye-L" cx="-26" cy="-88" r="10" fill="#F81C28"/><circle id="eye-R" cx="26" cy="-88" r="10" fill="#F81C28"/><g id="mouth" data-pivot="0,-28" transform="translate(0,-28) rotate(0)" style="transform-origin:0px -28px"><line x1="-26" y1="-4" x2="26" y2="-4" stroke="#000000" stroke-width="6" stroke-linecap="round"/></g></g></g></g></g>
</svg>
